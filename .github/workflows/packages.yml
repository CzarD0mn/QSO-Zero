# Builds installable .deb packages for the Cardputer Zero (Raspberry Pi CM0).
# arm64 = 64-bit Raspberry Pi OS, armhf = 32-bit. Built inside Debian Bookworm
# (the base of current Raspberry Pi OS) under QEMU, with the DSP tests run on
# the emulated ARM CPU before packaging.
#   push to main -> packages published on the `packages` branch
#   first push of a new app-builder.json "version" (no vX.Y.Z tag yet)
#     -> plain X.Y.Z packages, and GitHub creates tag vX.Y.Z + a Release
#   later pushes at the same version -> X.Y.Z~gitDATE.SHA snapshots (no Release)
name: packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(python3 -c 'import json;print(json.load(open("app-builder.json"))["version"])')
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; rel=true
          elif [ -z "$(git ls-remote --tags origin "refs/tags/v$base")" ]; then v="$base"; rel=true
          else v="$base~git$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"; rel=false; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "version $v (new release: $rel)"

  build:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
          - arch: armhf
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build, test and package (${{ matrix.arch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} -e VERSION -v "$PWD":/src -w /src debian:bookworm sh -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential binutils >/dev/null
            echo "building $VERSION on $(dpkg --print-architecture), $(gcc -dumpmachine)"
            make -j"$(nproc)" VERSION="$VERSION"
            out=build/test-results-$(dpkg --print-architecture).txt
            echo "QSO-Zero $VERSION tests on $(dpkg --print-architecture) ($(gcc -dumpmachine), QEMU)" > $out
            for t in input varicode wspr wsprrx ft8 js8 qsy devices modes battery mixer; do
              make -s build/test_$t VERSION="$VERSION"
              echo "### test_$t" >> $out
              if build/test_$t > build/t.log 2>&1; then tail -12 build/t.log >> $out
              else cat build/t.log >> $out; cat $out; echo "test_$t FAILED"; exit 1; fi
            done
            cat $out
            make deb VERSION="$VERSION"
            chown -R '"$(id -u):$(id -g)"' build'
      - uses: actions/upload-artifact@v4
        with:
          name: qso-zero-${{ matrix.arch }}
          path: |
            build/*.deb
            build/test-results-*.txt

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: debs
          merge-multiple: true
      - name: Publish to the packages branch
        run: |
          mkdir pkg && cp debs/*.deb debs/test-results-*.txt pkg/ && cd pkg
          {
            echo "# QSO-Zero packages"
            echo
            echo "Built from ${GITHUB_SHA} on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo '| file | sha256 |'
            echo '|---|---|'
            for f in *.deb; do echo "| $f | $(sha256sum "$f" | cut -c1-16)… |"; done
            echo
            echo 'On the Cardputer Zero: `dpkg --print-architecture` tells you which one you need (arm64 or armhf), then'
            echo '`sudo apt install ./qso-zero_<version>_<arch>.deb`'
            echo
            echo 'DSP test results on each ARM architecture: `test-results-arm64.txt`, `test-results-armhf.txt`.'
          } > README.md
          sha256sum *.deb > SHA256SUMS
          git init -q -b packages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "packages for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" packages
      - name: GitHub Release (new version)
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$V" debs/*.deb debs/test-results-*.txt --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "QSO-Zero v$V" --latest \
            --notes "Install on the Cardputer Zero: use the arm64 package (armhf is for 32-bit Raspberry Pi OS; \`dpkg --print-architecture\` tells you which). \`sudo apt install ./qso-zero_${V}_arm64.deb && sudo systemctl restart APPLaunch.service\`, then run \`qso-zero-setup\` once and open QSO-Zero from the launcher. Hold ESC to exit."
